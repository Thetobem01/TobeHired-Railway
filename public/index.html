/* Layout: a job-centre noticeboard. Big condensed-to-wide headline, a search card as the first real action, vacancy-slip rows for boards, quiet utility sections below. */
.tbh {
  --paper: #F1F4F1;
  --surface: #FFFFFF;
  --ink: #13202B;
  --muted: #4B5B66;
  --line: #CFD8D3;
  --accent: #0A5C9E;
  --accent-ink: #FFFFFF;
  --mark: #F5B700;
  --on-mark: #13202B;
  --good: #1B7A4B;
  --warn-bg: #FFF4D6;
  --warn-line: #E2B93B;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;

}
@media (prefers-color-scheme: dark) {

  }
}
.tbh[data-theme="dark"] {
  --paper: #0E1A22; --surface: #15252F; --ink: #E9F0ED; --muted: #9DAFB8; --line: #2A3C47;
  --accent: #62B4F2; --accent-ink: #0A1820; --good: #5FCB93; --warn-bg: #2B2410; --warn-line: #8A6E14;

}

*, *::before, *::after { box-sizing: border-box; }
.tbh {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-inline: clamp(16px, 4vw, 40px); padding-block: 0 48px;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px;
}
.wrap { max-width: 1080px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.05; }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.2rem); font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em; }

p { margin: 0; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 18px; }
.brand { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 1.25rem; letter-spacing: -.01em; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; display: block; }
nav.main { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: .95rem; font-weight: 600; }
nav.main a { color: var(--ink); text-decoration: none; padding-block: 4px; border-bottom: 2px solid transparent; }
nav.main a:hover { border-bottom-color: var(--mark); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 32px 48px; align-items: start; padding-block: 28px 56px; }
.hero h1 { font-weight: 800; font-stretch: 125%; font-size: clamp(2.3rem, 6.2vw, 4.1rem); letter-spacing: -.02em; }
.hl { background: linear-gradient(transparent 58%, var(--mark) 58% 92%, transparent 92%); padding-inline: .06em; }
.hero .lede { margin-top: 20px; font-size: 1.12rem; max-width: 34em; color: var(--muted); }
.hero .lede strong { color: var(--ink); }
.trust { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .9rem; font-weight: 600; }
.trust span::before { content: ""; display: inline-block; width: .55em; height: .55em; background: var(--good); border-radius: 50%; margin-right: 8px; }

.finder { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 22px; box-shadow: 6px 6px 0 var(--ink); }

.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 700; }
.field input {
  font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--line);
  border-radius: 4px; padding: 11px 12px; width: 100%; min-width: 0;
}
.field input:hover { border-color: var(--muted); }
.field input:focus { border-color: var(--accent); }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; border: 2px solid var(--ink);
  background: var(--mark); color: var(--on-mark); border-radius: 4px; padding: 12px 18px;
}
.btn:hover { filter: brightness(.95); }
.btn:active { transform: translateY(1px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--ink);
  background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px;
}
.chip:hover { border-color: var(--ink); }
.chips-label { margin-top: 18px; font-size: .8rem; color: var(--muted); font-weight: 600; }

/* sections */
section.block { padding-block: 56px; border-top: 2px solid var(--ink); }
.block-head { display: grid; gap: 10px; margin-bottom: 28px; max-width: 40em; }
.block-head p { color: var(--muted); }

/* vacancy slips */
.slips { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
.slip { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; }
.slip .stub { padding: 16px; border-right: 2px dashed var(--line); display: grid; align-content: center; gap: 4px; }
.slip .stub b { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 1.05rem; line-height: 1.15; }
.slip .stub small { color: var(--muted); font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.slip .body { padding: 16px 20px; min-width: 0; }
.slip .body p { font-size: .95rem; }
.slip .query { margin-top: 6px; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.slip .go { display: flex; align-items: center; padding: 16px 20px 16px 0; }
.go a { display: inline-block; text-decoration: none; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 10px 16px; white-space: nowrap; }
.go a:hover { filter: brightness(1.1); }
.note { margin-top: 14px; font-size: .88rem; color: var(--muted); }

/* plan */
.plan-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 32px; align-items: start; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 84px 1fr; align-items: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; }
.task label { display: contents; cursor: pointer; }
.task .day { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; padding: 14px 0 14px 14px; color: var(--muted); }
.task .what { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px 12px 0; }
.task input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--good); cursor: pointer; }
.task input:checked + span { text-decoration: line-through; color: var(--muted); }
.task:has(input:checked) { border-color: var(--good); }
.progress { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 20px; position: sticky; top: 16px; }
.progress .big { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { margin-top: 14px; height: 12px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .25s ease; }
.progress p { margin-top: 12px; font-size: .9rem; color: var(--muted); }
.progress button { margin-top: 14px; font: inherit; font-size: .85rem; font-weight: 600; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* CV */
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; padding: 22px; }
.panel h3 { margin-bottom: 12px; }
.panel ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.panel.yes { border-top: 5px solid var(--good); }
.panel.no { border-top: 5px solid var(--muted); }
.formula { margin-top: 20px; background: var(--surface); border: 1.5px dashed var(--ink); border-radius: 6px; padding: 20px 22px; }
.formula .eq { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 1.15rem; margin-top: 6px; }
.formula .eq em { font-style: normal; background: linear-gradient(transparent 58%, var(--mark) 58% 92%, transparent 92%); }
.formula .ex { margin-top: 10px; color: var(--muted); }

/* interview */
.qs { display: grid; gap: 10px; }
details { background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; }
details[open] { border-color: var(--ink); }
summary { cursor: pointer; padding: 16px 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--font-display); font-size: 1.3rem; line-height: 1; }
details[open] summary::after { content: "\\2212"; }
details .ans { padding: 0 18px 18px; color: var(--muted); max-width: 60ch; }
details .ans b { color: var(--ink); }

/* help */
.help { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; list-style: none; padding: 0; margin: 0; }
.help li { background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
.help a { font-weight: 700; font-family: var(--font-display); font-stretch: 105%; font-size: 1.05rem; }
.help span { color: var(--muted); font-size: .93rem; }
.scam { margin-top: 28px; background: var(--warn-bg); border: 2px solid var(--warn-line); border-radius: 6px; padding: 20px 22px; display: grid; gap: 8px; }
.scam h3 { font-size: 1.15rem; }
.scam ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

footer { margin-top: 24px; padding-top: 24px; border-top: 2px solid var(--ink); font-size: .88rem; color: var(--muted); display: grid; gap: 6px; }

@container (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding-bottom: 40px; }
  .plan-grid { grid-template-columns: minmax(0, 1fr); }
  .progress { position: static; order: -1; }
}
@container (max-width: 680px) {
  .slip { grid-template-columns: minmax(0, 1fr); }
  .slip .stub { border-right: none; border-bottom: 2px dashed var(--line); }
  .slip .go { padding: 0 20px 18px; }
  .two, .help { grid-template-columns: minmax(0, 1fr); }
  .finder { box-shadow: 4px 4px 0 var(--ink); padding: 18px; }
  .task { grid-template-columns: 72px 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* jobs by town */
.town-group + .town-group { margin-top: 30px; }
.town-group h3 { margin-bottom: 12px; }
.town-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 20px; }
.town-list a { font-size: .95rem; display: inline-block; padding-block: 2px; }

.task.cont { margin-top: -2px; border-top-left-radius: 0; border-top-right-radius: 0; }
.task.cont .day { visibility: hidden; }

</style>
<div class="tbh">
<div class="wrap">

      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="17" width="24" height="8" rx="1.5" fill="var(--ink)"/><rect x="1" y="9" width="17" height="8" rx="1.5" fill="var(--accent)"/><rect x="1" y="1" width="10" height="8" rx="1.5" fill="var(--mark)"/></svg>

    <nav class="main" aria-label="Sections">

  </header>

  <main id="top">
    <div class="hero">
      <div>
        <p class="eyebrow">Free job-search help for the UK</p>
        <h1 style="margin-top:14px">Find work you can <span class="hl">start.</span></h1>
        <p class="lede">Tell us the job and the town. TobeHired opens the same search on four UK job sites, then walks you through your first week of applying, a CV that gets read, and what to say in the interview. <strong>No sign-up, no fees, no catch.</strong></p>
        <div class="trust">
          <span>Free to use</span>
          <span>No account needed</span>
          <span>Links to official sources</span>
        </div>
      </div>

      <aside class="finder" id="search" aria-labelledby="finder-title">
        <h2 id="finder-title">Search four job sites at once</h2>
        <form id="searchForm" novalidate>
          <div class="field">
            <label for="kw">Job or skill</label>
            <input id="kw" name="kw" type="text" placeholder="e.g. care assistant, driver, receptionist" autocomplete="off">
          </div>
          <div class="field">
            <label for="loc">Town, city or postcode</label>
            <input id="loc" name="loc" type="text" placeholder="e.g. Leeds or LS1 4AP" autocomplete="off">
          </div>
          <button class="btn" type="submit">Build my searches</button>
        </form>
        <p class="chips-label">Popular starting points</p>
        <div class="chips" id="chips">
          <button class="chip" type="button">Care assistant</button>
          <button class="chip" type="button">Warehouse operative</button>
          <button class="chip" type="button">Customer service</button>
          <button class="chip" type="button">Kitchen porter</button>
          <button class="chip" type="button">Delivery driver</button>
          <button class="chip" type="button">Admin assistant</button>
        </div>
      </aside>
    </div>

    <section class="block" aria-labelledby="boards-h">
      <div class="block-head">
        <p class="eyebrow">Where to look</p>
        <h2 id="boards-h">Four places that list real vacancies</h2>
        <p id="boardsLead">Enter a job and a place above. Each button below then opens that search on the site, in a new tab.</p>
      </div>
      <ul class="slips" id="slips"></ul>
      <p class="note">Some sites open on their own home page, so type your job and town in the site's search box. Set up a free job alert on at least two of these so new vacancies reach you the day they are posted. TobeHired is independent and not affiliated with these sites.</p>
    </section>

    <section class="block" id="week" aria-labelledby="week-h">
      <div class="block-head">
        <p class="eyebrow">Your first week</p>
        <h2 id="week-h">Seven days to a proper start</h2>
        <p>Tick each step as you finish it. Your progress stays in this browser, so you can close the page and come back.</p>
      </div>
      <div class="plan-grid">
        <ul class="tasks" id="tasks"></ul>
        <div class="progress" aria-live="polite">
          <p class="eyebrow">Done so far</p>
          <p class="big"><span id="doneCount">0</span> / <span id="totalCount">9</span></p>
          <div class="bar" role="progressbar" aria-label="Weekly plan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barFill"></i></div>
          <p id="progressMsg">Start with Day 1. It takes about 20 minutes.</p>
          <button type="button" id="resetBtn">Clear all ticks</button>
        </div>
      </div>
    </section>

    <section class="block" id="cv" aria-labelledby="cv-h">
      <div class="block-head">
        <p class="eyebrow">Your CV</p>
        <h2 id="cv-h">One page. Newest job first.</h2>
        <p>Employers often spend under a minute on a first look. Put the proof near the top and cut anything that does not help you get this job.</p>
      </div>
      <div class="two">
        <div class="panel yes">
          <h3>Put in</h3>
          <ul>
            <li>Name, phone, email and your town</li>
            <li>A two-line profile: who you are and what job you want</li>
            <li>Jobs, newest first, with 3 short bullet points each</li>
            <li>Certificates and tickets (food hygiene, first aid, forklift, driving licence)</li>
            <li>Education and training, briefly</li>
            <li>A line that references are available on request</li>
          </ul>
        </div>
        <div class="panel no">
          <h3>Leave out</h3>
          <ul>
            <li>A photo, your date of birth or your full home address</li>
            <li>Long paragraphs about your personality</li>
            <li>Every job you have ever done. Keep the last 10 years unless an older one fits</li>
            <li>Unexplained gaps. Add one honest line, such as "Caring for family" or "Retraining"</li>
            <li>Spelling mistakes. Read it aloud, then ask someone else to read it</li>
          </ul>
        </div>
      </div>
      <div class="formula">
        <p class="eyebrow">Write every bullet like this</p>
        <p class="eq"><em>What you did</em> + <em>how much or how often</em> + <em>the result</em></p>
        <p class="ex">Example: "Served up to 120 customers a day on a busy till, with no cash differences in six months."</p>
      </div>
    </section>

    <section class="block" id="interview" aria-labelledby="int-h">
      <div class="block-head">
        <p class="eyebrow">Interviews</p>
        <h2 id="int-h">Five questions you will probably get</h2>
        <p>Practise your answers out loud, twice each. It feels odd and it works.</p>
      </div>
      <div class="qs">
        <details>
          <summary>"Tell me about yourself."</summary>
          <div class="ans"><b>Keep it to 30 seconds.</b> Say what you do now or did last, one thing you are good at, and why you want this job. Do not start at primary school.</div>
        </details>
        <details>
          <summary>"Why do you want this job?"</summary>
          <div class="ans"><b>Be specific.</b> Mention something real about the employer, such as the hours, the team, the training or what they do. Read their website the night before.</div>
        </details>
        <details>
          <summary>"Tell me about a time you dealt with a difficult situation."</summary>
          <div class="ans"><b>Use STAR.</b> Situation: what was happening. Task: what you had to do. Action: what you did, using "I". Result: what changed. Have two of these stories ready.</div>
        </details>
        <details>
          <summary>"What are your strengths?"</summary>
          <div class="ans"><b>Pick two and prove them.</b> "I am reliable" means little. "I have had no unplanned absences in two years" means a lot.</div>
        </details>
        <details>
          <summary>"Do you have any questions for us?"</summary>
          <div class="ans"><b>Always say yes.</b> Ask what a good first month looks like, what training you would get, or when they will decide. Save pay and holiday questions for the offer stage unless they raise them.</div>
        </details>
      </div>
    </section>

    <section class="block" id="support" aria-labelledby="sup-h">
      <div class="block-head">
        <p class="eyebrow">Support</p>
        <h2 id="sup-h">Free help beyond this page</h2>
        <p>These are official or charity services. None of them should ever ask you to pay to get a job.</p>
      </div>
      <ul class="help">
        <li><a href="https://nationalcareers.service.gov.uk" target="_blank" rel="noopener">National Careers Service</a><span>Free advice from a careers adviser, CV help and a skills assessment.</span></li>
        <li><a href="https://www.gov.uk/contact-jobcentre-plus" target="_blank" rel="noopener">Jobcentre Plus</a><span>Work coaches, benefits support and local job help. Find your nearest office.</span></li>
        <li><a href="https://www.kingstrust.org.uk" target="_blank" rel="noopener">The King's Trust</a><span>Training, mentoring and support into work for people aged 11 to 30.</span></li>
        <li><a href="https://www.citizensadvice.org.uk" target="_blank" rel="noopener">Citizens Advice</a><span>Help with money, work rights and anything standing in the way of a job.</span></li>
        <li><a href="https://www.acas.org.uk" target="_blank" rel="noopener">Acas</a><span>Free guidance on your rights at work, contracts and pay.</span></li>
        <li><a href="https://www.turn2us.org.uk" target="_blank" rel="noopener">Turn2us</a><span>Check which benefits and grants you may be able to claim while you search.</span></li>
      </ul>
      <div class="scam" role="note">
        <h3>Spot a job scam</h3>
        <ul>
          <li>A real employer never asks you to pay for a job, a uniform, a check or training up front.</li>
          <li>Be wary of offers with no interview, or messages that arrive out of nowhere on WhatsApp or text.</li>
          <li>Never share your bank details or ID before you have a signed contract.</li>
          <li>Unsure? Search the company name with the word "scam", and contact them using details from their own website.</li>
        </ul>
      </div>
    </section>
    <section class="block" id="towns" aria-labelledby="towns-h">

(function () {

    { id: "indeed", name: "Indeed", tag: "Largest", best: "The biggest mix of employers and agencies. Easy to set up email alerts and apply quickly.",
      url: function (k, l) { return "https://uk.indeed.com/jobs?q=" + enc(k) + "&l=" + enc(l); }, home: "https://uk.indeed.com/" },
    { id: "reed", name: "Reed", tag: "Wide range", best: "Strong for office, retail, logistics and agency work, with salary shown on many listings.",
      url: function (k, l) { var s = slug(k), p = slug(l); return "https://www.reed.co.uk/jobs/" + (s ? s + "-" : "") + "jobs" + (p ? "-in-" + p : ""); }, home: "https://www.reed.co.uk/jobs" },
    { id: "nhs", name: "NHS Jobs", tag: "Healthcare", best: "Every NHS vacancy in one place, from healthcare support and admin to catering and porters.",
      url: function (k, l) { return "https://www.jobs.nhs.uk/candidate/search/results?keyword=" + enc(k) + "&location=" + enc(l); }, home: "https://www.jobs.nhs.uk/" }
  ];
  function enc(s) { return encodeURIComponent((s || "").trim()); }
  function slug(s) { return (s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }

  var slips = root.getElementById("slips");
  var lead = root.getElementById("boardsLead");
  var kw = root.getElementById("kw");
  var loc = root.getElementById("loc");

  function renderBoards() {
    var k = kw.value.trim(), l = loc.value.trim();
    var hasQuery = k || l;
    slips.innerHTML = "";
    boards.forEach(function (b) {
      var li = document.createElement("li");
      li.className = "slip";
      var href = hasQuery ? b.url(k, l) : b.home;
      var label = hasQuery ? "Open search" : "Open site";
      li.innerHTML =
        '<div class="stub"><small></small><b></b></div>' +
        '<div class="body"><p></p><p class="query"></p></div>' +
        '<div class="go"><a target="_blank" rel="noopener"></a></div>';
      li.querySelector("small").textContent = b.tag;
      li.querySelector("b").textContent = b.name;
      li.querySelector(".body p").textContent = b.best;
      li.querySelector(".query").textContent = hasQuery
        ? "Searching for " + (k ? "“" + k + "”" : "all jobs") + (l ? " near " + l : "")
        : "";
      var a = li.querySelector(".go a");
      a.href = href;
      a.textContent = label;
      a.setAttribute("aria-label", label + " on " + b.name);
      slips.appendChild(li);
    });
    lead.textContent = hasQuery
      ? "Your searches are ready. Each button opens the results on that site, in a new tab."
      : "Enter a job and a place above. Each button below then opens that search on the site, in a new tab.";
  }

  root.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    renderBoards();
    root.getElementById("boards-h").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  kw.addEventListener("input", renderBoards);
  loc.addEventListener("input", renderBoards);
  root.getElementById("chips").addEventListener("click", function (e) {
    var t = e.target.closest(".chip");
    if (!t) return;
    kw.value = t.textContent;
    renderBoards();
    (loc.value ? kw : loc).focus();
  });

  /* weekly plan */
  var steps = [
    { d: "Day 1", t: "Write down the three job titles you would take tomorrow." },
    { d: "Day 1", t: "Save a one-page CV with your jobs, skills and contact details." },
    { d: "Day 2", t: "Use a sensible email address and record a clear voicemail greeting." },
    { d: "Day 2", t: "Register with Find a job and one other site, and turn on job alerts." },
    { d: "Day 3", t: "Ask two people if they will act as your referees." },
    { d: "Day 4", t: "Apply for three jobs. Change the top third of your CV to match each advert." },
    { d: "Day 5", t: "Tell friends, family and past colleagues what you are looking for." },
    { d: "Day 6", t: "Practise three interview answers out loud." },
    { d: "Day 7", t: "Check which applications got replies and adjust your search." }
  ];
  var KEY = "foothold-week-v1";
  var state = [];
  try { state = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (err) { state = []; }
  if (!Array.isArray(state)) state = [];

  var list = root.getElementById("tasks");
  steps.forEach(function (s, i) {
    var li = document.createElement("li");
    li.className = "task";
    li.innerHTML = '<label><span class="day"></span><span class="what"><input type="checkbox" id="step' + i + '"><span></span></span></label>';
    var prev = steps[i - 1], same = !!prev && prev.d === s.d;
    if (same) li.classList.add("cont");
    li.querySelector(".day").textContent = s.d;
    li.querySelector(".what > span").textContent = s.t;
    var cb = li.querySelector("input");
    cb.setAttribute("aria-label", s.d + ": " + s.t);
    cb.checked = state.indexOf(i) !== -1;
    cb.addEventListener("change", function () { save(); update(); });
    list.appendChild(li);
  });

  function checks() { return Array.prototype.slice.call(list.querySelectorAll("input")); }
  function save() {
    var done = [];
    checks().forEach(function (c, i) { if (c.checked) done.push(i); });
    try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  }
  function update() {
    var all = checks(), n = all.filter(function (c) { return c.checked; }).length, tot = all.length;
    var pct = Math.round(n / tot * 100);
    root.getElementById("doneCount").textContent = n;
    root.getElementById("totalCount").textContent = tot;
    root.getElementById("barFill").style.width = pct + "%";
    root.querySelector(".bar").setAttribute("aria-valuenow", pct);
    var msg = "Start with Day 1. It takes about 20 minutes.";
    if (n > 0 && n < 4) msg = "Good start. Your CV and alerts are the foundation.";
    else if (n >= 4 && n < tot) msg = "Over halfway. Applications are where replies come from.";
    else if (n === tot) msg = "All done. Repeat Day 4 and Day 7 each week until you land something.";
    root.getElementById("progressMsg").textContent = msg;
  }
  root.getElementById("resetBtn").addEventListener("click", function () {
    checks().forEach(function (c) { c.checked = false; });
    save(); update();
  });

  /* in-embed navigation: hash links and town picks work inside the shadow root */
  root.addEventListener("click", function (e) {
    var town = e.target.closest("a[data-town]");
    if (town) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
      e.preventDefault();
      loc.value = town.getAttribute("data-town");
      renderBoards();
      root.getElementById("search").scrollIntoView({ behavior: "smooth", block: "start" });
      (kw.value ? loc : kw).focus({ preventScroll: true });
      return;
    }
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var target = root.getElementById(a.getAttribute("href").slice(1));
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  renderBoards();
  update();
})();
